<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Jurídico</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>
  <div id="app" class="hidden">
    <header>
      <div>
        <h1>Painel Jurídico</h1>
        <p id="roleBadge">Carregando...</p>
      </div>
      <div class="header-actions">
        <button id="btnRefresh">Atualizar</button>
        <button id="btnClose" class="danger">Fechar</button>
      </div>
    </header>

    <main>
      <aside>
        <button class="tab active" data-tab="dashboard">Dashboard</button>
        <button class="tab" data-tab="processes">Processos</button>
        <button class="tab" data-tab="settings">Configurações</button>
      </aside>

      <section class="content">
        <div id="dashboard" class="panel active">
          <h2>Réus elegíveis para tribunal criminal</h2>
          <p class="muted">Critério: mínimo de <span id="requiredCasesLabel">3</span> casos vinculados.</p>
          <div class="actions">
            <button id="btnNewProcess">Nova causa (família/trabalhista/geral/criminal)</button>
          </div>
          <div id="candidates" class="cards"></div>
        </div>

        <div id="processes" class="panel">
          <h2>Processos em andamento</h2>
          <div class="row">
            <button id="procTabOngoing" class="mini-tab active">Em andamento</button>
            <button id="procTabDone" class="mini-tab">Concluídos / Sentenciados</button>
            <input id="processSearch" type="text" placeholder="Pesquisar por nº processo, acusado ou tipo..." />
          </div>
          <div id="processList" class="cards"></div>
          <div id="processDetail" class="detail hidden"></div>
        </div>

        <div id="settings" class="panel">
          <h2>Configurações de gatilho</h2>
          <label>Casos criminais necessários para distribuição automática:</label>
          <div class="row">
            <input type="number" id="inputRequiredCases" min="1" max="10" />
            <button id="btnSaveSettings">Salvar</button>
          </div>
          <p class="muted" id="settingsHint"></p>
        </div>
      </section>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modalTitle">Ação</h3>
      <div id="modalFields"></div>
      <div class="actions">
        <button id="modalCancel" class="danger">Cancelar</button>
        <button id="modalConfirm">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
