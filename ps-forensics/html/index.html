<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS-Forensics - Sistema Forense</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="forensics-app" class="hidden">
        <!-- Header -->
        <div class="forensics-header">
            <div class="header-left">
                <i class="fas fa-microscope"></i>
                <span class="header-title">SISTEMA FORENSE</span>
                <span class="header-subtitle" id="playerInfo"></span>
            </div>
            <div class="header-right">
                <span class="role-badge" id="roleBadge"></span>
                <button class="btn-close" onclick="closeUI()"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Navigation -->
        <div class="forensics-nav">
            <button class="nav-btn active" data-tab="scenes" onclick="switchTab('scenes')">
                <i class="fas fa-map-marked-alt"></i> Cenas
            </button>
            <button class="nav-btn" data-tab="evidence" onclick="switchTab('evidence')">
                <i class="fas fa-fingerprint"></i> Evidências
            </button>
            <button class="nav-btn" data-tab="lab" onclick="switchTab('lab')">
                <i class="fas fa-flask"></i> Laboratório
            </button>
            <button class="nav-btn" data-tab="autopsy" onclick="switchTab('autopsy')">
                <i class="fas fa-skull-crossbones"></i> Legista
            </button>
            <button class="nav-btn" data-tab="reports" onclick="switchTab('reports')">
                <i class="fas fa-file-medical"></i> Laudos
            </button>
        </div>

        <!-- Content Area -->
        <div class="forensics-content">

            <!-- DASHBOARD -->
            <div id="tab-dashboard" class="tab-content">
                <div class="tab-header">
                    <h2><i class="fas fa-chart-line"></i> Dashboard Forense</h2>
                    <div class="tab-actions">
                        <button class="btn-secondary" onclick="loadDashboard()"><i class="fas fa-sync-alt"></i> Atualizar</button>
                    </div>
                </div>
                <div id="dashboardStats" class="dashboard-grid">
                    <div class="dashboard-loading">
                        <i class="fas fa-spinner fa-spin"></i> Carregando estatísticas...
                    </div>
                </div>
                <div id="dashboardRecent" class="dashboard-recent"></div>
            </div>

            <!-- CENAS DE CRIME -->
            <div id="tab-scenes" class="tab-content">
                <div class="tab-header">
                    <h2><i class="fas fa-map-marked-alt"></i> Cenas de Crime</h2>
                    <div class="tab-actions">
                        <input type="text" id="sceneSearch" placeholder="Buscar cena..." class="search-input" onkeyup="searchScenes()">
                        <select id="sceneStatusFilter" class="filter-select" onchange="filterScenes()">
                            <option value="">Todos os Status</option>
                            <option value="aberta">Aberta</option>
                            <option value="isolada">Isolada</option>
                            <option value="em_processamento">Em Processamento</option>
                            <option value="finalizada">Finalizada</option>
                            <option value="reaberta">Reaberta</option>
                        </select>
                        <button class="btn-primary" onclick="showCreateScene()"><i class="fas fa-plus"></i> Nova Cena</button>
                    </div>
                </div>
                <div id="scenesList" class="items-grid"></div>
                <div id="sceneDetail" class="detail-panel hidden"></div>
            </div>

            <!-- EVIDÊNCIAS -->
            <div id="tab-evidence" class="tab-content">
                <div class="tab-header">
                    <h2><i class="fas fa-fingerprint"></i> Evidências Forenses</h2>
                    <div class="tab-actions">
                        <input type="text" id="evidenceSearch" placeholder="Buscar por nº, tipo, lacre..." class="search-input" onkeyup="searchEvidence()">
                        <select id="evidenceCategoryFilter" class="filter-select" onchange="filterEvidence()">
                            <option value="">Todas Categorias</option>
                            <option value="balistica">Balística</option>
                            <option value="biologica">Biológica</option>
                            <option value="digital_impressao">Impressões</option>
                            <option value="quimica">Química</option>
                            <option value="documental">Documental</option>
                            <option value="eletronica">Eletrônica</option>
                            <option value="vestimenta">Vestimenta</option>
                            <option value="veiculo">Veículo</option>
                            <option value="objeto_cortante">Obj. Cortante</option>
                            <option value="objeto_contundente">Obj. Contundente</option>
                            <option value="outros">Outros</option>
                        </select>
                        <select id="evidenceStatusFilter" class="filter-select" onchange="filterEvidence()">
                            <option value="">Todos os Status</option>
                            <option value="coletada">Coletada</option>
                            <option value="lacrada">Lacrada</option>
                            <option value="em_analise">Em Análise</option>
                            <option value="analisada">Analisada</option>
                            <option value="armazenada">Armazenada</option>
                            <option value="descartada">Descartada</option>
                            <option value="devolvida">Devolvida</option>
                            <option value="em_julgamento">Em Julgamento</option>
                        </select>
                        <button class="btn-secondary" onclick="showRegisterFingerprint()"><i class="fas fa-hand-dots"></i> Cadastro Digital</button>
                        <button class="btn-secondary" onclick="showRegisterDNA()"><i class="fas fa-dna"></i> Cadastro DNA</button>
                    </div>
                </div>
                <div id="evidenceList" class="items-grid"></div>
                <div id="evidenceDetail" class="detail-panel hidden"></div>
            </div>

            <!-- LABORATÓRIO -->
            <div id="tab-lab" class="tab-content">
                <div class="tab-header">
                    <h2><i class="fas fa-flask"></i> Laboratório Forense</h2>
                    <div class="tab-actions">
                        <select id="labStatusFilter" class="filter-select" onchange="filterLabTests()">
                            <option value="">Todos</option>
                            <option value="solicitado">Solicitados</option>
                            <option value="em_andamento">Em Andamento</option>
                            <option value="concluido">Concluídos</option>
                            <option value="cancelado">Cancelados</option>
                        </select>
                        <button class="btn-secondary" onclick="showQuickBallisticRegister()"><i class="fas fa-crosshairs"></i> Registrar Balística</button>
                        <button class="btn-secondary" onclick="showRegisterDrugAnalysis()"><i class="fas fa-pills"></i> Nova Análise de Drogas</button>
                    </div>
                </div>
                <div id="labTestsList" class="items-grid"></div>
                <div id="labTestDetail" class="detail-panel hidden"></div>
            </div>

            <!-- LEGISTA -->
            <div id="tab-autopsy" class="tab-content">
                <div class="tab-header">
                    <h2><i class="fas fa-skull-crossbones"></i> Instituto Médico Legal</h2>
                    <div class="tab-actions">
                        <select id="autopsyStatusFilter" class="filter-select" onchange="filterAutopsies()">
                            <option value="">Todos os Status</option>
                            <option value="em_andamento">Em Andamento</option>
                            <option value="concluido">Concluído</option>
                        </select>
                        <button class="btn-primary" onclick="showCreateAutopsy()" id="btnNewAutopsy"><i class="fas fa-plus"></i> Nova Necropsia</button>
                    </div>
                </div>
                <div id="autopsyList" class="items-grid"></div>
                <div id="autopsyDetail" class="detail-panel hidden"></div>
            </div>

            <!-- LAUDOS -->
            <div id="tab-reports" class="tab-content">
                <div class="tab-header">
                    <h2><i class="fas fa-file-medical"></i> Laudos Técnicos</h2>
                    <div class="tab-actions">
                        <select id="reportTypeFilter" class="filter-select" onchange="filterReports()">
                            <option value="">Todos os Tipos</option>
                            <option value="laudo_pericial">Laudo Pericial</option>
                            <option value="laudo_balistico">Laudo Balístico</option>
                            <option value="laudo_toxicologico">Laudo Toxicológico</option>
                            <option value="laudo_dna">Laudo DNA</option>
                            <option value="laudo_digital">Laudo Digital</option>
                            <option value="laudo_necropsia">Laudo Necropsia</option>
                            <option value="laudo_drogas">Laudo Drogas</option>
                        </select>
                        <select id="reportStatusFilter" class="filter-select" onchange="filterReports()">
                            <option value="">Todos os Status</option>
                            <option value="rascunho">Rascunho</option>
                            <option value="em_revisao">Em Revisão</option>
                            <option value="finalizado">Finalizado</option>
                            <option value="anexado_mdt">Anexado ao MDT</option>
                        </select>
                        <button class="btn-primary" onclick="showCreateReport()"><i class="fas fa-plus"></i> Novo Laudo</button>
                    </div>
                </div>
                <div id="reportsList" class="items-grid"></div>
                <div id="reportDetail" class="detail-panel hidden"></div>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h3 id="modalTitle"></h3>
                    <button class="btn-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer" id="modalFooter"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
